name: Deploy

on:
  push:
    branches:
      - develop

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5

          with:
            python-version: "3.12"

        - name: Install dependencies
          run: |
            pip install -r requirements.txt

        - name: Run tests
          run: |
            pytest

    deploy:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Deploy to VPS
          uses:
            appleboy/ssh-action@v1.0.3
          with:
            host: ${{VPS_HOST}}
            user: ${{VPS_USER}}
            key: ${{VPS_SSH_KEY}}
            script: |
              cd ~/pawn1
              ./deploy.sh
