name: Deploy


on:

  push:

    branches:
      - main



jobs:


  test:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout code
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          pip install -r requirements.txt



      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest



  deploy:


    needs: test


    runs-on: ubuntu-latest


    steps:


      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.SERVER_IP }}

          username: ${{ secrets.SERVER_USER }}

          key: ${{ secrets.SSH_PRIVATE_KEY_PC }}

          script: |

            #whoami
            
            #pwd

            #ls -la

            cd ~/pawn1

            #docker ps
            git checkout main
            git pull origin main

            ./scripts/deploy.sh
