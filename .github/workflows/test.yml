name: Test API

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        env:
          #DATABASE_URL: postgresql://minhdv:123456@db:5432/pawn
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest
