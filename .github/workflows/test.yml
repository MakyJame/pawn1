name: Test API

on:
  push:
    branches:
      - develop

jobs:
  test:
    run-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: action/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
